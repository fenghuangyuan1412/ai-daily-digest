name: 每日 AI 日报

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      window_hours:
        description: '回溯小时数'
        required: false
        default: '36'

concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 生成日报
        env:
          WINDOW_HOURS: ${{ github.event.inputs.window_hours || vars.WINDOW_HOURS || '36' }}
          EXTRA_FEED_URLS: ${{ vars.EXTRA_FEED_URLS }}
          # TRANSLATE=off 可关掉 MyMemory 中文翻译（变量里填 off）
          TRANSLATE: ${{ vars.TRANSLATE || 'on' }}
          # 可选：填邮箱能把匿名配额从 ~2000字/天 提到 30000字/天，非凭据
          MYMEMORY_EMAIL: ${{ vars.MYMEMORY_EMAIL }}
        run: node src/build.mjs digest

      - name: 提交产物
        run: |
          git config user.name "ai-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digest
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore(digest): $(node -p "require('./digest/latest.json').date")"
            git push
          fi
